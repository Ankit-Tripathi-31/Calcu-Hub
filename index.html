
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="All-in-One Calculator Hub" />
  <title>Calculator Hub</title>
  <link rel="stylesheet" href="css/styles.css" />
 <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app-layout">

    <!-- Left Sidebar -->
    <aside class="sidebar">
      <a href="#home" class="brand" data-page="home">
        <span class="brand-icon">⌗</span>
        <span>Calc<span class="brand-accent">Hub</span></span>
      </a>

      <p class="menu-label">MAIN MENU</p>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="home">
          <span>⌂</span> Dashboard
        </button>
        <button class="nav-item" data-page="basic">
          <span>＋</span> Basic Calculator
        </button>
        <button class="nav-item" data-page="interest">
          <span>%</span> Simple Interest
        </button>
        <button class="nav-item" data-page="bmi">
          <span>♡</span> BMI Calculator
        </button>
        <button class="nav-item" data-page="history">
          <span class="nav-icon">↺</span>
          <span>Calculation History</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings">
          <span>⚙</span> Settings
        </button>
        <div class="sidebar-note">
          <span class="note-dot"></span>
          <div>
            <strong>Calculator Hub</strong>
            <small>Your everyday tools</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">YOUR PERSONAL TOOLKIT</p>
          <h1 id="page-title">Dashboard</h1>
        </div>

        <div class="topbar-right">
          <span class="status-dot"></span>
          <span class="status-text">All tools in one place</span>
        </div>
      </header>

      <section id="page-content" aria-live="polite">
        <!-- Dashboard content is rendered by app.js -->
      </section>

      <footer class="footer">
        Calculator Hub <span>·</span> Built for everyday calculations
      </footer>
    </main>
  </div>
</body>
</html>
